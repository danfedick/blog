<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-labelledby="t d">
<title id="t">How a PHP2Shell attack works</title>
<desc id="d">An attacker sends one unauthenticated HTTP request. A PHP core flaw, CVE-2026-109618 or CVE-2026-109619, rated CVSS v4.0 9.2, lets that request run code. The attacker gets remote code execution on the web server, then reads config files and secrets and reaches the database. Fix: update to PHP 8.5.12, 8.4.27, 8.3.36 or 8.2.35, released October 21 at about 10:00 AM ET.</desc>
<style>.s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
<rect width="760" height="640" rx="16" fill="#0f1113"/>
<text x="24" y="40" class="s" font-size="14" font-weight="700" fill="#9a9b9e">THE ATTACK</text>
<text x="132" y="40" class="s" font-size="20" font-weight="700" fill="#e8e4dc">One request to the database</text>
<rect x="20" y="62" width="720" height="96" rx="10" fill="#16191c" stroke="#3a3a3a" stroke-width="1.5"/>
<circle cx="56" cy="110" r="16" fill="#ccff00"/><text x="56" y="116" class="s" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle">1</text>
<text x="90" y="96" class="s" font-size="19" font-weight="700" fill="#e8e4dc">Attacker</text>
<text x="90" y="122" class="s" font-size="16" fill="#e8e4dc">Sends one unauthenticated HTTP request</text>
<line x1="56" y1="158" x2="56" y2="170" stroke="#9a9b9e" stroke-width="2.2"/><path d="M56,180 l-7,-12 h14 z" fill="#9a9b9e"/>
<rect x="20" y="180" width="720" height="96" rx="10" fill="#16191c" stroke="#ccff00" stroke-width="1.5"/>
<circle cx="56" cy="228" r="16" fill="#ccff00"/><text x="56" y="234" class="s" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle">2</text>
<text x="90" y="214" class="s" font-size="19" font-weight="700" fill="#e8e4dc">PHP core flaw</text>
<text x="90" y="240" class="m" font-size="16" fill="#e8e4dc">CVE-2026-109618 / CVE-2026-109619</text>
<text x="90" y="262" class="s" font-size="14" fill="#9a9b9e">CVSS v4.0 9.2, before any app code runs</text>
<line x1="56" y1="276" x2="56" y2="288" stroke="#9a9b9e" stroke-width="2.2"/><path d="M56,298 l-7,-12 h14 z" fill="#9a9b9e"/>
<rect x="20" y="298" width="720" height="96" rx="10" fill="#16191c" stroke="#3a3a3a" stroke-width="1.5"/>
<circle cx="56" cy="346" r="16" fill="#ccff00"/><text x="56" y="352" class="s" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle">3</text>
<text x="90" y="332" class="s" font-size="19" font-weight="700" fill="#e8e4dc">Remote code execution</text>
<text x="90" y="358" class="s" font-size="16" fill="#e8e4dc">Code runs on the web server</text>
<text x="90" y="380" class="s" font-size="14" fill="#9a9b9e">with the rights of the web worker account</text>
<line x1="56" y1="394" x2="56" y2="406" stroke="#9a9b9e" stroke-width="2.2"/><path d="M56,416 l-7,-12 h14 z" fill="#9a9b9e"/>
<rect x="20" y="416" width="720" height="96" rx="10" fill="#16191c" stroke="#3a3a3a" stroke-width="1.5"/>
<circle cx="56" cy="464" r="16" fill="#ccff00"/><text x="56" y="470" class="s" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle">4</text>
<text x="90" y="450" class="s" font-size="19" font-weight="700" fill="#e8e4dc">Secrets and database</text>
<text x="90" y="476" class="s" font-size="16" fill="#e8e4dc">Reads config files and secrets</text>
<text x="90" y="498" class="s" font-size="14" fill="#9a9b9e">then reaches the database</text>
<rect x="20" y="538" width="720" height="92" rx="10" fill="#0b0b0b" stroke="#ccff00" stroke-width="2" stroke-dasharray="8 6"/>
<text x="44" y="572" class="s" font-size="14" font-weight="700" fill="#ccff00">FIX</text>
<text x="94" y="572" class="s" font-size="18" font-weight="700" fill="#e8e4dc">Update to PHP 8.5.12 / 8.4.27 / 8.3.36 / 8.2.35</text>
<text x="94" y="602" class="s" font-size="15" fill="#9a9b9e">Released Oct 21, about 10:00 AM ET. No complete mitigations.</text>
</svg>