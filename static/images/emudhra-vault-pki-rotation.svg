<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" width="760" height="760" role="img" aria-labelledby="t d"><title id="t">Vault PKI: root, intermediate, short-lived agent certs, scheduled rotation</title><desc id="d">Root CA in pki signs the intermediate CA in pki_int. The agents role issues agent certs with a TTL of 1h, max 24h. On a schedule a new intermediate is signed, made default, and tidy cleans up expired certs and old issuers.</desc><style>.s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style><rect width="760" height="760" rx="16" fill="#0f1113"/><text x="24" y="40" class="s" font-size="14" font-weight="700" fill="#ccff00">SETUP</text><text x="95" y="40" class="s" font-size="20" font-weight="700" fill="#e8e4dc">Root signs intermediate</text><rect x="20" y="58" width="720" height="250" rx="10" fill="#16191c" stroke="#3a3a3a" stroke-width="1.5"/><rect x="60" y="82" width="280" height="90" rx="10" fill="#0b0b0b" stroke="#ccff00" stroke-width="1.5"/><text x="200.0" y="112" class="s" font-size="16" font-weight="700" fill="#e8e4dc" text-anchor="middle">Root CA</text><text x="200.0" y="134" class="s" font-size="14" font-weight="400" fill="#9a9b9e" text-anchor="middle">mount: pki</text><text x="200.0" y="156" class="s" font-size="14" font-weight="400" fill="#9a9b9e" text-anchor="middle">max TTL 10 years</text><rect x="420" y="82" width="280" height="90" rx="10" fill="#0b0b0b" stroke="#3a3a3a" stroke-width="1.5"/><text x="560.0" y="112" class="s" font-size="16" font-weight="700" fill="#e8e4dc" text-anchor="middle">Intermediate CA</text><text x="560.0" y="134" class="s" font-size="14" font-weight="400" fill="#9a9b9e" text-anchor="middle">mount: pki_int</text><text x="560.0" y="156" class="s" font-size="14" font-weight="400" fill="#9a9b9e" text-anchor="middle">max TTL 1 year</text><line x1="340" y1="127" x2="420" y2="127" stroke="#ccff00" stroke-width="2.2"/><path d="M420,127 l-14,-7 v14 z" fill="#ccff00"/><text x="380" y="112" class="s" font-size="13" fill="#9a9b9e" text-anchor="middle">signs CSR</text><rect x="420" y="200" width="280" height="90" rx="10" fill="#0b0b0b" stroke="#3a3a3a" stroke-width="1.5"/><text x="560.0" y="230" class="s" font-size="16" font-weight="700" fill="#e8e4dc" text-anchor="middle">Role: agents</text><text x="560.0" y="252" class="m" font-size="14" font-weight="400" fill="#9a9b9e" text-anchor="middle">*.agents.example.internal</text><text x="560.0" y="274" class="s" font-size="14" font-weight="400" fill="#9a9b9e" text-anchor="middle">ttl 1h, max_ttl 24h</text><line x1="560" y1="172" x2="560" y2="186" stroke="#9a9b9e" stroke-width="2.2"/><path d="M560,200 l-7,-14 h14 z" fill="#9a9b9e"/><rect x="60" y="200" width="280" height="90" rx="10" fill="#0b0b0b" stroke="#ccff00" stroke-width="1.5"/><text x="200.0" y="230" class="s" font-size="16" font-weight="700" fill="#e8e4dc" text-anchor="middle">Agent cert</text><text x="200.0" y="252" class="s" font-size="14" font-weight="400" fill="#9a9b9e" text-anchor="middle">build-01.agents...</text><text x="200.0" y="274" class="s" font-size="14" font-weight="400" fill="#9a9b9e" text-anchor="middle">expires in 1h</text><line x1="420" y1="245" x2="340" y2="245" stroke="#ccff00" stroke-width="2.2"/><path d="M340,245 l-14,-7 v14 z" fill="#ccff00"/><text x="380" y="232" class="s" font-size="13" fill="#9a9b9e" text-anchor="middle">issue</text><text x="24" y="360" class="s" font-size="14" font-weight="700" fill="#ccff00">ROTATE</text><text x="106" y="360" class="s" font-size="20" font-weight="700" fill="#e8e4dc">Intermediate rotation on a schedule</text><rect x="20" y="378" width="720" height="350" rx="10" fill="#16191c" stroke="#3a3a3a" stroke-width="1.5"/><circle cx="64" cy="414" r="14" fill="#ccff00"/><text x="64" y="419" class="s" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">1</text><text x="92" y="419" class="s" font-size="16" fill="#e8e4dc">Generate new intermediate CSR in pki_int</text><circle cx="64" cy="466" r="14" fill="#ccff00"/><text x="64" y="471" class="s" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">2</text><text x="92" y="471" class="s" font-size="16" fill="#e8e4dc">Root signs it, then set-signed</text><circle cx="64" cy="518" r="14" fill="#ccff00"/><text x="64" y="523" class="s" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">3</text><text x="92" y="523" class="s" font-size="16" fill="#e8e4dc">root/replace makes it the default issuer</text><circle cx="64" cy="570" r="14" fill="#ccff00"/><text x="64" y="575" class="s" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">4</text><text x="92" y="575" class="s" font-size="16" fill="#e8e4dc">Agents renew and get certs from the new issuer</text><circle cx="64" cy="622" r="14" fill="#ccff00"/><text x="64" y="627" class="s" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">5</text><text x="92" y="627" class="s" font-size="16" fill="#e8e4dc">Old certs expire within 24h</text><circle cx="64" cy="674" r="14" fill="#ccff00"/><text x="64" y="679" class="s" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">6</text><text x="92" y="679" class="s" font-size="16" fill="#e8e4dc">tidy removes expired certs and issuers</text></svg>