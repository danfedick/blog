<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 746" width="760" height="746" role="img" aria-labelledby="t d">
<title id="t">How the Vault database secrets engine works</title><desc id="d">The PHP app logs in to Vault with AppRole, Kubernetes or a cloud identity and gets a token scoped by policy. It reads database/creds/app-readonly. Vault uses its own admin connection, database/config/app-postgres, whose password was rotated with rotate-root so only Vault knows it, and runs the role's creation statements: CREATE ROLE with a password and VALID UNTIL expiry, then GRANT SELECT. Vault returns a unique username, password and lease with a default TTL of 1h. The app connects to PostgreSQL with those credentials. Renewing the lease extends it up to the 24h max TTL. When the TTL ends or someone runs vault lease revoke, Vault drops the database user.</desc>
<style>.s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
<rect width="760" height="746" rx="16" fill="#0f1113"/>
<text x="24" y="40" class="s" font-size="14" font-weight="700" fill="#9a9b9e">VAULT</text>
<text x="88" y="40" class="s" font-size="20" font-weight="700" fill="#e8e4dc">How the database secrets engine works</text>
<rect x="20" y="62" width="720" height="98" rx="10" fill="#16191c" stroke="#3a3a3a" stroke-width="1.5"/>
<circle cx="54" cy="92" r="15" fill="#ccff00"/><text x="54" y="98" class="s" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">1</text>
<text x="86" y="98" class="s" font-size="19" font-weight="700" fill="#e8e4dc">App logs in to Vault</text>
<text x="86" y="126" class="s" font-size="16" fill="#b8b9bc">AppRole, Kubernetes or cloud identity</text>
<text x="86" y="152" class="s" font-size="16" fill="#b8b9bc">Gets a token scoped by policy</text>
<line x1="54" y1="160" x2="54" y2="170" stroke="#9a9b9e" stroke-width="2.2"/><path d="M54,180 l-7,-12 h14 z" fill="#9a9b9e"/>
<rect x="20" y="182" width="720" height="72" rx="10" fill="#16191c" stroke="#3a3a3a" stroke-width="1.5"/>
<circle cx="54" cy="212" r="15" fill="#ccff00"/><text x="54" y="218" class="s" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">2</text>
<text x="86" y="218" class="s" font-size="19" font-weight="700" fill="#e8e4dc">App asks for credentials</text>
<text x="86" y="246" class="m" font-size="16" fill="#e8e4dc">vault read database/creds/app-readonly</text>
<line x1="54" y1="254" x2="54" y2="264" stroke="#9a9b9e" stroke-width="2.2"/><path d="M54,274 l-7,-12 h14 z" fill="#9a9b9e"/>
<rect x="20" y="276" width="720" height="124" rx="10" fill="#16191c" stroke="#ccff00" stroke-width="1.5"/>
<circle cx="54" cy="306" r="15" fill="#ccff00"/><text x="54" y="312" class="s" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">3</text>
<text x="86" y="312" class="s" font-size="19" font-weight="700" fill="#e8e4dc">Vault creates a unique database user</text>
<text x="86" y="340" class="s" font-size="16" fill="#b8b9bc">Uses its own connection: database/config/app-postgres</text>
<text x="86" y="366" class="s" font-size="16" fill="#b8b9bc">(admin password rotated with rotate-root, known only to Vault)</text>
<text x="86" y="392" class="m" font-size="16" fill="#e8e4dc">CREATE ROLE ... VALID UNTIL expiry; GRANT SELECT ...</text>
<line x1="54" y1="400" x2="54" y2="410" stroke="#9a9b9e" stroke-width="2.2"/><path d="M54,420 l-7,-12 h14 z" fill="#9a9b9e"/>
<rect x="20" y="422" width="720" height="98" rx="10" fill="#16191c" stroke="#3a3a3a" stroke-width="1.5"/>
<circle cx="54" cy="452" r="15" fill="#ccff00"/><text x="54" y="458" class="s" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">4</text>
<text x="86" y="458" class="s" font-size="19" font-weight="700" fill="#e8e4dc">Vault returns credentials and a lease</text>
<text x="86" y="486" class="m" font-size="16" fill="#e8e4dc">username  v-token-app-read-...</text>
<text x="86" y="512" class="m" font-size="16" fill="#e8e4dc">password + lease_id, default_ttl 1h</text>
<line x1="54" y1="520" x2="54" y2="530" stroke="#9a9b9e" stroke-width="2.2"/><path d="M54,540 l-7,-12 h14 z" fill="#9a9b9e"/>
<rect x="20" y="542" width="720" height="72" rx="10" fill="#16191c" stroke="#3a3a3a" stroke-width="1.5"/>
<circle cx="54" cy="572" r="15" fill="#ccff00"/><text x="54" y="578" class="s" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">5</text>
<text x="86" y="578" class="s" font-size="19" font-weight="700" fill="#e8e4dc">App connects to PostgreSQL</text>
<text x="86" y="606" class="s" font-size="16" fill="#b8b9bc">Each app instance has its own username</text>
<rect x="20" y="628" width="720" height="98" rx="10" fill="#0b0b0b" stroke="#ccff00" stroke-width="2" stroke-dasharray="8 6"/>
<text x="44" y="662" class="s" font-size="18" font-weight="700" fill="#ccff00">LEASE ENDS</text>
<text x="44" y="690" class="s" font-size="16" fill="#b8b9bc">Renew: extends the lease, up to max_ttl 24h</text>
<text x="44" y="716" class="s" font-size="16" fill="#b8b9bc">TTL ends or vault lease revoke: Vault drops the user</text>
</svg>