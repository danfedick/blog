<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" width="760" height="900" role="img" aria-labelledby="t d"><title id="t">eMudhra: weak intermediate key, who got blocked, who trusted it</title><desc id="d">A weak intermediate key was recoverable from the public certificate. An attacker could mint a cert for any site. Browsers block it with revocation lists and CT enforcement. Non-browser clients that skip revocation and CT trust it. Defense: update trust stores and use short-lived certs with routine rotation.</desc><style>.s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style><rect width="760" height="900" rx="16" fill="#0f1113"/><text x="24" y="40" class="s" font-size="14" font-weight="700" fill="#FC4C13">ATTACK</text><text x="106" y="40" class="s" font-size="20" font-weight="700" fill="#e8e4dc">A key anyone could recover</text><rect x="20" y="58" width="720" height="300" rx="10" fill="#16191c" stroke="#3a3a3a" stroke-width="1.5"/><rect x="60" y="82" width="280" height="90" rx="10" fill="#0b0b0b" stroke="#3a3a3a" stroke-width="1.5"/><text x="200.0" y="112" class="s" font-size="16" font-weight="700" fill="#e8e4dc" text-anchor="middle">Public intermediate cert</text><text x="200.0" y="134" class="s" font-size="14" font-weight="400" fill="#9a9b9e" text-anchor="middle">8 eMudhra intermediates</text><text x="200.0" y="156" class="s" font-size="14" font-weight="400" fill="#9a9b9e" text-anchor="middle">weak keys since Apr 2025</text><rect x="420" y="82" width="280" height="90" rx="10" fill="#0b0b0b" stroke="#FC4C13" stroke-width="1.5"/><text x="560.0" y="112" class="s" font-size="16" font-weight="700" fill="#e8e4dc" text-anchor="middle">Private key recovered</text><text x="560.0" y="134" class="s" font-size="14" font-weight="400" fill="#9a9b9e" text-anchor="middle">from the public cert</text><text x="560.0" y="156" class="s" font-size="14" font-weight="400" fill="#9a9b9e" text-anchor="middle">reported Oct 17, 2026</text><line x1="340" y1="127" x2="420" y2="127" stroke="#FC4C13" stroke-width="2.2"/><path d="M420,127 l-14,-7 v14 z" fill="#FC4C13"/><rect x="240" y="230" width="280" height="100" rx="10" fill="#0b0b0b" stroke="#FC4C13" stroke-width="1.5"/><text x="380.0" y="260" class="s" font-size="16" font-weight="700" fill="#e8e4dc" text-anchor="middle">Attacker mints a cert</text><text x="380.0" y="282" class="s" font-size="14" font-weight="400" fill="#9a9b9e" text-anchor="middle">for any site</text><text x="380.0" y="304" class="s" font-size="14" font-weight="400" fill="#9a9b9e" text-anchor="middle">bank.example, api.example.gov</text><line x1="560" y1="172" x2="380" y2="216" stroke="#FC4C13" stroke-width="2.2"/><path d="M380,230 l-7,-14 h14 z" fill="#FC4C13"/><text x="24" y="410" class="s" font-size="14" font-weight="700" fill="#9a9b9e">CLIENTS</text><text x="117" y="410" class="s" font-size="20" font-weight="700" fill="#e8e4dc">Same cert, two outcomes</text><rect x="20" y="428" width="720" height="250" rx="10" fill="#16191c" stroke="#3a3a3a" stroke-width="1.5"/><rect x="50" y="452" width="310" height="120" rx="10" fill="#0b0b0b" stroke="#ccff00" stroke-width="1.5"/><text x="205.0" y="482" class="s" font-size="16" font-weight="700" fill="#e8e4dc" text-anchor="middle">Browsers: blocked</text><text x="205.0" y="504" class="s" font-size="14" font-weight="400" fill="#9a9b9e" text-anchor="middle">Firefox, Chrome: Oct 17</text><text x="205.0" y="526" class="s" font-size="14" font-weight="400" fill="#9a9b9e" text-anchor="middle">Apple: Oct 19, Microsoft: Oct 20</text><text x="205.0" y="548" class="s" font-size="14" font-weight="400" fill="#9a9b9e" text-anchor="middle">OneCRL, CRLite, CRLSets, CT</text><rect x="400" y="452" width="310" height="120" rx="10" fill="#0b0b0b" stroke="#FC4C13" stroke-width="1.5"/><text x="555.0" y="482" class="s" font-size="16" font-weight="700" fill="#e8e4dc" text-anchor="middle">Other clients: trusted</text><text x="555.0" y="504" class="s" font-size="14" font-weight="400" fill="#9a9b9e" text-anchor="middle">curl, Go, Java, Python, Node</text><text x="555.0" y="526" class="s" font-size="14" font-weight="400" fill="#9a9b9e" text-anchor="middle">old ca-certificates in images</text><text x="555.0" y="548" class="s" font-size="14" font-weight="400" fill="#9a9b9e" text-anchor="middle">no revocation or CT check</text><text x="205" y="608" class="s" font-size="16" fill="#ccff00" text-anchor="middle">Certificate error</text><text x="555" y="608" class="s" font-size="16" fill="#FC4C13" text-anchor="middle">Connection looks fine</text><text x="24" y="730" class="s" font-size="14" font-weight="700" fill="#ccff00">DEFENSE</text><text x="117" y="730" class="s" font-size="20" font-weight="700" fill="#e8e4dc">Trust store updates and short-lived certs</text><rect x="20" y="748" width="720" height="130" rx="10" fill="#16191c" stroke="#ccff00" stroke-width="1.5"/><circle cx="54" cy="781" r="6" fill="#ccff00"/><text x="72" y="786" class="s" font-size="16" fill="#e8e4dc">Patch ca-certificates and runtime bundles, rebuild images</text><circle cx="54" cy="815" r="6" fill="#ccff00"/><text x="72" y="820" class="s" font-size="16" fill="#e8e4dc">Test with the curl check: a cert error is the good result</text><circle cx="54" cy="849" r="6" fill="#ccff00"/><text x="72" y="854" class="s" font-size="16" fill="#e8e4dc">Short-lived certs and scheduled intermediate rotation</text></svg>